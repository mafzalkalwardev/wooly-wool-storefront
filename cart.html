<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cart — Wooly Wool</title>

  <link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body class="page-enter">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">

    <a class="navbar-brand brand-badge" href="index.html">
      <span class="brand d-flex align-items-center gap-2">
        <img src="assets/img/logo.png" alt="Wooly Wool Logo">
        <span>
          <div class="fw-bold">Wooly Wool</div>
          <div class="tag">Stitches With Love</div>
        </span>
      </span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto gap-lg-2 align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>

        <!-- Cart badge -->
        <li class="nav-item">
          <a class="nav-link position-relative active" href="cart.html">
            <i class="bi bi-cart3 me-1"></i> Cart
            <span id="cartBadge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              style="display:none;">
              0
            </span>
          </a>
        </li>

        <li class="nav-item"><a class="nav-link" href="track-order.html">Track Order</a></li>
      </ul>
    </div>

  </div>
</nav>

<!-- HEADER -->
<header class="py-5">
  <div class="container">
    <div class="hero-box p-4 fade-up">
      <h1 class="hero-title mb-2">
        <i class="bi bi-cart3 me-2"></i>Your Cart
      </h1>
      <p class="hero-sub mb-0">Review your items before checkout ✅</p>
    </div>
  </div>
</header>

<!-- CART -->
<main class="pb-5">
  <div class="container">

    <div class="product-card p-3 p-md-4">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Item</th>
              <th>Product</th>
              <th>Price</th>
              <th style="width:140px;">Qty</th>
              <th class="text-end">Total</th>
            </tr>
          </thead>

          <tbody id="cartTable">
            <!-- rendered by JS -->
          </tbody>
        </table>
      </div>

      <hr class="my-4">

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="fs-5 fw-bold">
          Total: <span id="cartTotal">Rs. 0</span>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-dark" href="shop.html">
            <i class="bi bi-arrow-left me-2"></i> Continue Shopping
          </a>

          <a id="checkoutBtn" class="btn btn-primary" href="checkout.html">
            <i class="bi bi-bag-check me-2"></i> Checkout
          </a>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="footer mt-5">
  <div class="container py-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="text-muted-custom small">© <span id="year"></span> Wooly Wool</div>
    <div class="text-muted-custom small">Delivery across all over World</div>
  </div>
</footer>

<!-- Floating WhatsApp -->
<a id="floatingWhatsApp" class="floating-whatsapp" href="#" target="_blank">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>


<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  function toggleCheckoutBtn(){
    const cart = JSON.parse(localStorage.getItem("woolywool_cart") || "[]");
    const btn = document.getElementById("checkoutBtn");
    if(!btn) return;

    if(!cart.length){
      btn.classList.add("disabled");
      btn.setAttribute("aria-disabled","true");
      btn.href = "javascript:void(0)";
    }else{
      btn.classList.remove("disabled");
      btn.removeAttribute("aria-disabled");
      btn.href = "checkout.html";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderCartPage();
    toggleCheckoutBtn();
  });
</script>

</body>
</html>
